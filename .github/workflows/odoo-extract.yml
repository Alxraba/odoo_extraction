name: Odoo Extract Daily

on:
  schedule:
    # 07:30 UTC = 09:30 Paris en été (CEST) / 08:30 Paris en hiver (CET)
    # GitHub cron n'a pas de timezone. Si tu veux 09:30 pile en hiver,
    # change pour '30 8 * * *' entre fin octobre et fin mars.
    - cron: "30 7 * * *"
  workflow_dispatch:   # bouton "Run workflow" manuel

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run extraction
        env:
          ODOO_URL:            ${{ secrets.ODOO_URL }}
          ODOO_DB:             ${{ secrets.ODOO_DB }}
          ODOO_USER:           ${{ secrets.ODOO_USER }}
          ODOO_API_KEY:        ${{ secrets.ODOO_API_KEY }}
          AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SP_SITE_HOSTNAME:    ${{ secrets.SP_SITE_HOSTNAME }}
          SP_SITE_PATH:        ${{ secrets.SP_SITE_PATH }}
          SP_DRIVE_NAME:       ${{ secrets.SP_DRIVE_NAME }}
          SP_FOLDER_PATH:      ${{ secrets.SP_FOLDER_PATH }}
        run: python odoo_extract.py
